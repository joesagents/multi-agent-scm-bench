[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scm_bench"
version = "0.3.0"
description = "4-tier agentic supply-chain testbed (beer game) for benchmarking agents."
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Joachim Ehrenthal" },
]
keywords = ["supply-chain", "multi-agent", "beer-game", "a2a", "llm-agents", "bullwhip"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
llm-transformers = [
    "transformers>=4.40",
    "torch>=2.2",
]
llm-vllm = [
    "vllm>=0.5",
]

[project.scripts]
scm-bench = "scm_bench.cli:app"
scm_bench = "scm_bench.cli:app"  # alias: the package-name spelling also works

[project.urls]
Repository = "https://github.com/joesagents/multi-agent-scm-bench"

[tool.hatch.build.targets.wheel]
packages = ["src/scm_bench"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
